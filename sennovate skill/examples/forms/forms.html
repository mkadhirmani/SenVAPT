<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sennovate - Form & Credential Configuration</title>
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: var(--sennovate-light-slate);
      font-family: var(--font-family-body);
      color: var(--color-text-primary);
      padding: var(--space-8);
      margin: 0;
    }
    .form-container {
      max-width: 640px;
      margin: 0 auto;
      background: #FFFFFF;
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      box-shadow: var(--shadow-sm);
    }
    .form-header {
      margin-bottom: var(--space-6);
      padding-bottom: var(--space-4);
      border-bottom: 1px solid var(--color-border-subtle);
    }
    .form-title {
      font-family: var(--font-family-display);
      font-size: var(--font-size-2xl);
      font-weight: 700;
      color: var(--sennovate-deep-navy);
      margin-bottom: var(--space-2);
    }
    .form-desc {
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
    }
    .field-group {
      margin-bottom: var(--space-5);
    }
    .field-label {
      display: flex;
      justify-content: space-between;
      font-size: var(--font-size-sm);
      font-weight: 500;
      margin-bottom: var(--space-2);
      color: var(--sennovate-deep-navy);
    }
    .field-input, .field-select {
      width: 100%;
      height: 38px;
      padding: 0 var(--space-3);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-md);
      font-size: var(--font-size-base);
      box-sizing: border-box;
      font-family: var(--font-family-body);
    }
    .field-input:focus, .field-select:focus {
      outline: none;
      border-color: var(--sennovate-blue);
      box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.15);
    }
    .secret-box {
      display: flex;
      align-items: center;
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #FFFFFF;
    }
    .secret-box input {
      flex: 1;
      border: none;
      height: 38px;
      padding: 0 var(--space-3);
      font-family: var(--font-family-mono);
      font-size: var(--font-size-sm);
    }
    .secret-box button {
      background: #F8FAFC;
      border: none;
      border-left: 1px solid var(--color-border-subtle);
      padding: 0 var(--space-3);
      height: 38px;
      cursor: pointer;
      font-size: var(--font-size-xs);
      font-weight: 500;
      color: var(--color-text-secondary);
    }
    .secret-box button:hover {
      background: #EDF2F7;
      color: var(--sennovate-blue);
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) 0;
    }
    .actions-row {
      display: flex;
      justify-content: flex-end;
      gap: var(--space-3);
      margin-top: var(--space-6);
      padding-top: var(--space-4);
      border-top: 1px solid var(--color-border-subtle);
    }
    .btn {
      padding: 0 var(--space-4);
      height: 38px;
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      font-weight: 500;
      cursor: pointer;
    }
    .btn-secondary {
      background: #FFFFFF;
      border: 1px solid var(--color-border-subtle);
      color: var(--color-text-primary);
    }
    .btn-primary {
      background: var(--sennovate-blue);
      border: none;
      color: #FFFFFF;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="form-header">
      <h1 class="form-title">Vanta Integration Settings</h1>
      <p class="form-desc">Configure automated compliance synchronization and audit webhook secrets.</p>
    </div>

    <form onsubmit="event.preventDefault();">
      <div class="field-group">
        <label class="field-label" for="conn-name">Connection Name</label>
        <input id="conn-name" type="text" class="field-input" value="Sennovate Production Audit Engine">
      </div>

      <div class="field-group">
        <label class="field-label" for="sync-frequency">Audit Sync Frequency</label>
        <select id="sync-frequency" class="field-select">
          <option>Every 15 Minutes (Recommended)</option>
          <option>Hourly</option>
          <option>Daily at 00:00 UTC</option>
        </select>
      </div>

      <div class="field-group">
        <label class="field-label" for="webhook-secret">Webhook Signing Secret</label>
        <div class="secret-box">
          <input id="webhook-secret" type="password" value="vanta_sec_89dfa019e34cb12998a76b" readonly>
          <button type="button" onclick="const f = document.getElementById('webhook-secret'); f.type = f.type === 'password' ? 'text' : 'password'; this.textContent = f.type === 'password' ? 'Reveal' : 'Hide';">Reveal</button>
          <button type="button" onclick="navigator.clipboard.writeText(document.getElementById('webhook-secret').value); this.textContent = 'Copied!'; setTimeout(() => this.textContent = 'Copy', 1500);">Copy</button>
        </div>
      </div>

      <div class="toggle-row">
        <div>
          <div style="font-weight: 500; font-size: 14px;">Auto-Quarantine on SOC2 Failure</div>
          <div style="font-size: 12px; color: #64748B;">Instantly isolate identities flagged with high-severity compliance deviations.</div>
        </div>
        <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: var(--sennovate-blue);">
      </div>

      <div class="actions-row">
        <button type="button" class="btn btn-secondary">Discard</button>
        <button type="submit" class="btn btn-primary">Save Configuration</button>
      </div>
    </form>
  </div>
</body>
</html>
